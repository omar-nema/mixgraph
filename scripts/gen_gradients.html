<!DOCTYPE html>
<html>
<body>
<script>
const gradientPalettes = [
  ['#EB4679','#051681','#EE7F7D','#265BC9','#C25EA5','#7961D3'],
  ['#FF6B6B','#4ECDC4','#2C3E50','#F39C12','#8E44AD'],
  ['#E44D90','#2B86C5','#784BA0','#F5AF19','#C850C0'],
  ['#0F2027','#2C5364','#203A43','#E8775F','#F2A65A'],
  ['#DA4453','#89216B','#2980B9','#6DD5FA','#FF512F'],
  ['#A770EF','#CF8BF3','#FDB99B','#5B86E5','#36D1DC'],
  ['#654EA3','#EAAFC8','#F093FB','#F5576C','#4FACFE'],
  ['#1A2980','#26D0CE','#4776E6','#8E54E9','#00C9FF'],
  ['#EC6F66','#F3A183','#2C3E50','#3498DB','#9B59B6'],
  ['#C33764','#1D2671','#FDC830','#F37335','#6441A5'],
  ['#E65C00','#F9D423','#2B5876','#4E4376','#C94B4B'],
  ['#B24592','#F15F79','#00B4DB','#0083B0','#8360C3'],
];

const SIZE = 120;
const NUM = 40;

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

async function generate() {
  const canvas = document.createElement('canvas');
  canvas.width = SIZE; canvas.height = SIZE;
  const ctx = canvas.getContext('2d');
  const links = [];

  for (let n = 0; n < NUM; n++) {
    const h = n * 7919;
    const palette = gradientPalettes[n % gradientPalettes.length];
    const positions = [
      [h % 40 + 10, h % 30 + 10],
      [70 + (h >> 4) % 20, h % 25 + 5],
      [(h >> 8) % 30 + 10, 70 + (h >> 2) % 20],
      [60 + (h >> 6) % 30, 60 + (h >> 3) % 30],
      [40 + (h >> 5) % 20, 40 + (h >> 7) % 20],
    ];

    const [br,bg,bb] = hexToRgb(palette[1]);
    ctx.fillStyle = `rgb(${br},${bg},${bb})`;
    ctx.fillRect(0, 0, SIZE, SIZE);

    for (let i = palette.length - 1; i >= 0; i--) {
      const [x, y] = positions[i % positions.length];
      const size = 50 + ((h >> (i * 3)) % 40);
      const cx = (x/100)*SIZE, cy = (y/100)*SIZE, radius = (size/100)*SIZE;
      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      const [cr,cg,cb] = hexToRgb(palette[i]);
      grad.addColorStop(0, `rgba(${cr},${cg},${cb},1)`);
      grad.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, SIZE, SIZE);
    }

    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.85));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${n}.jpg`;
    links.push(a);
  }

  // Auto-download all
  for (const a of links) { a.click(); await new Promise(r => setTimeout(r, 50)); }
  document.body.textContent = `Done! ${NUM} images downloaded.`;
}
generate();
</script>
</body>
</html>
